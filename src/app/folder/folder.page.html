<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div id="container">
    <div class="content">
      <div class="container">
        <div class="title">Bienvenido a Nerdy's</div>
        <div class="content-subject">
          <div class="subjects">
            <h2 class="mySubjects"><ion-icon name="arrow-forward-outline"></ion-icon>Mis materias</h2>
            <div class="button-container">
              <ion-button class="buttonAdd" expand="block" (click)="addSubject('Nueva materia')">Default</ion-button>
              {{ mySubjects }}
            </div>
          </div>
          <div class="schedule">
            <h2 class="mySchedule"><ion-icon name="arrow-forward-outline"></ion-icon>Mi horario</h2>
          </div>
        </div>
      </div>
      <div class="box"></div>
    </div>
  </div>
</ion-content>
